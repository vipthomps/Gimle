name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches the version built into the binary
        run: |
          want="VERSION=${GITHUB_REF_NAME#v}"
          have="$(tr -d '\n' < backend/internal/web/public/version)"
          [ "$have" = "$want" ] || { echo "backend/internal/web/public/version says $have, tag says $want"; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
        working-directory: backend
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
